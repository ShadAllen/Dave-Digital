<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Dave</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--tx:#1d1d1f;--mu:#6e6e73;--ln:#d2d2d7;--up:#1a8f3c;--dn:#d62f2f;--ac:#0066cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg2:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#38383a;--up:#30d158;--dn:#ff453a;--ac:#2997ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--bg2:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#38383a;--up:#30d158;--dn:#ff453a;--ac:#2997ff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font-weight:600;font-size:18px;letter-spacing:-.02em}
.idx{display:flex;gap:24px;font-size:13px;color:var(--mu)}
.idx b{display:block;color:var(--tx);font-size:15px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}
.tag{margin-left:auto;font-size:12px;color:var(--mu)}
.wrap{display:flex;min-height:calc(100vh - 60px)}
nav{width:220px;flex:none;padding:16px 12px;border-right:1px solid var(--ln)}
nav small{display:block;padding:12px 12px 4px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
nav a{display:block;padding:6px 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
nav a:hover{background:var(--bg2)}
nav a.on{color:var(--ac);font-weight:600;background:var(--bg2)}
main{flex:1;min-width:0;padding:32px 28px 64px;max-width:960px}
h1{font-size:40px;font-weight:700;letter-spacing:-.03em;margin-bottom:24px}
h2{font-size:17px;font-weight:600;margin:32px 0 8px}
.sc{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th{text-align:left;font-weight:500;color:var(--mu);background:var(--bg2);padding:10px 16px}
td{padding:11px 16px;border-top:1px solid var(--ln)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
a.s{color:var(--ac);text-decoration:none}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.up{background:rgba(48,209,88,.15)}.pill.dn{background:rgba(255,69,58,.15)}
.note{margin-top:32px;color:var(--mu);font-size:12px;max-width:640px}
@media(max-width:760px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px}nav small{display:none}nav a{white-space:nowrap}main{padding:24px 16px 48px}h1{font-size:32px}header{padding:12px 16px}.tag{display:none}}
</style>
</head>
<body>
<header>
  <span class="logo">Digital Dave</span>
  <div class="idx" id="idx"></div>
  <span class="tag">Free. No sign-up.</span>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
/* SAMPLE DATA. Replace with your own: SYMBOL,PrevHigh,PrevLow,PrevClose,LTP separated by ; */
var INDEX=[["Nifty 50",25907.95,140.20],["Bank Nifty",54051.55,500.70]];
var RAW={
auto:["Auto","MARUTI,12900,12700,12780,12850;M&M,3250,3180,3200,3235;TATAMOTORS,720,704,710,716"],
ancillaries:["Auto Ancillaries","BOSCHLTD,38200,37500,37800,38050;MOTHERSON,108,105,106,107.5;BHARATFORG,1290,1262,1275,1268"],
capitalgoods:["Capital goods","LT,3720,3650,3690,3710;SIEMENS,3150,3080,3110,3095;ABB,5300,5180,5230,5275"],
cements:["Cements","ULTRACEMCO,12100,11880,11950,12060;AMBUJACEM,585,574,579,583;SHREECEM,27100,26600,26800,26720"],
fmcg:["FMCG","HINDUNILVR,2450,2410,2425,2438;ITC,418,411,414,416;NESTLEIND,1260,1238,1245,1252"],
it:["IT","TCS,3050,3000,3020,3042;INFY,1560,1530,1545,1538;WIPRO,265,260,262,264"],
insurance:["Insurance","SBILIFE,1850,1815,1830,1842;HDFCLIFE,770,756,762,759;ICICIGI,1920,1885,1900,1914"],
metals:["Metals","TATASTEEL,175,171,172.5,174;JSWSTEEL,1080,1058,1066,1074;HINDALCO,720,704,711,708"],
nbfc:["NBFC","BAJFINANCE,1010,985,995,1004;SHRIRAMFIN,640,625,631,636;CHOLAFIN,1620,1585,1600,1592"],
chemicals:["Chemicals","PIDILITIND,3050,2995,3015,3040;SRF,2850,2790,2815,2802;UPL,640,628,633,638"],
durables:["Consumer Durables","TITAN,3600,3530,3560,3585;HAVELLS,1580,1550,1562,1570;VOLTAS,1450,1420,1432,1425"],
oilgas:["Oil & gas","RELIANCE,1480,1455,1465,1474;ONGC,245,240,242,243.5;IOC,168,165,166,167"],
others:["Others","ADANIPORTS,1450,1415,1430,1442;ASIANPAINT,2480,2430,2450,2441;GRASIM,2780,2730,2750,2768"],
pharma:["Pharma","SUNPHARMA,1740,1705,1720,1712;CIPLA,1560,1530,1542,1555;DRREDDY,1290,1265,1275,1281"],
power:["Power","NTPC,345,338,341,343;POWERGRID,295,290,292,293;TATAPOWER,395,386,390,388"],
pvtbanks:["Private Banks","HDFCBANK,1010,995,1002,1008;ICICIBANK,1380,1355,1366,1374;AXISBANK,1180,1155,1165,1171"],
psubanks:["PSU Banks","SBIN,880,862,870,876;PNB,112,109.5,110.5,111.4;BANKBARODA,255,249,251,253"],
realty:["Realty","DLF,780,761,770,776;GODREJPROP,2260,2205,2230,2262;OBEROIRLTY,1745,1710,1725,1728"],
telecom:["Telecom","BHARTIARTL,2050,2015,2030,2044;IDEA,8.1,7.8,7.9,7.95;INDUSTOWER,395,386,390,388"]
};
function f(x){return x.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function parse(s){return s.split(";").map(function(r){var p=r.split(",");var H=+p[1],L=+p[2],C=+p[3],T=+p[4],P=(H+L+C)/3;
 return{sym:p[0],H:H,L:L,C:C,ltp:T,chg:(T/C-1)*100,P:P,R1:2*P-L,S1:2*P-H,R2:P+H-L,S2:P-H+L}})}
var SEC={};Object.keys(RAW).forEach(function(k){SEC[k]={name:RAW[k][0],st:parse(RAW[k][1])}});
function avg(k){var a=SEC[k].st;return a.reduce(function(s,x){return s+x.chg},0)/a.length}
function cls(v){return v>=0?"up":"dn"}
function pc(v){return (v>=0?"+":"")+v.toFixed(2)+"%"}
function link(k,t){return '<a class="s" href="#'+k+'">'+t+'</a>'}

document.getElementById("idx").innerHTML=INDEX.map(function(i){return "<div>"+i[0]+"<b>"+f(i[1])+' <span class="up">('+f(i[2])+")</span></b></div>"}).join("");
document.getElementById("nav").innerHTML='<a href="#overview" data-k="overview">Overview</a><small>Sectors</small>'+Object.keys(SEC).map(function(k){return '<a href="#'+k+'" data-k="'+k+'">'+SEC[k].name+"</a>"}).join("");

function table(h,rows,nc){return '<div class="sc"><table><tr>'+h.map(function(x,i){return '<th class="'+(i>=nc?"n":"")+'">'+x+"</th>"}).join("")+"</tr>"+rows.join("")+"</table></div>"}
function tr(c){return "<tr>"+c.map(function(x,i){return '<td class="'+(x[1]||"")+'">'+x[0]+"</td>"}).join("")+"</tr>"}

function overview(){
 var ks=Object.keys(SEC).sort(function(a,b){return avg(b)-avg(a)});
 var all=[];ks.forEach(function(k){SEC[k].st.forEach(function(s){all.push([k,s])})});
 all.sort(function(a,b){return b[1].chg-a[1].chg});
 var top=all.map(function(a){var x=a[1];return{k:a[0],x:x,sc:x.chg+0.5*((x.ltp-x.P)/x.P*100)}}).sort(function(a,b){return b.sc-a.sc}).slice(0,6);
 var h="<h1>Overview</h1><h2>Top 6 strongest stocks</h2>"+table(["#","Symbol","Sector","LTP","Change","Stop loss","Target"],top.map(function(t,i){var x=t.x;return tr([[i+1],[x.sym],[link(t.k,SEC[t.k].name)],[f(x.ltp),"n"],[pc(x.chg),"n "+cls(x.chg)],[f(x.S1),"n"],[f(x.R1),"n"]])}),3)+'<p class="note" style="margin-top:8px">Screener output, ranked by today’s change plus distance above the pivot. Not a recommendation.</p><h2>Sector strength</h2>'+table(["Rank","Sector","Avg change"],ks.map(function(k,i){return tr([[i+1],[link(k,SEC[k].name)],[pc(avg(k)),"n "+cls(avg(k))]])}),2);
 h+="<h2>Top 5 stocks</h2>"+table(["Rank","Symbol","Sector","LTP","Change"],all.slice(0,5).map(function(a,i){return tr([[i+1],[a[1].sym],[link(a[0],SEC[a[0]].name)],[f(a[1].ltp),"n"],[pc(a[1].chg),"n "+cls(a[1].chg)]])}),3);
 h+="<h2>Bottom 5 stocks</h2>"+table(["Rank","Symbol","Sector","LTP","Change"],all.slice(-5).reverse().map(function(a,i){return tr([[i+1],[a[1].sym],[link(a[0],SEC[a[0]].name)],[f(a[1].ltp),"n"],[pc(a[1].chg),"n "+cls(a[1].chg)]])}),3);
 return h}

function sector(k){
 var s=SEC[k].st,h="<h1>"+SEC[k].name+"</h1>";
 h+="<h2>Stop loss &amp; target</h2>"+table(["#","Symbol","Side","Entry (LTP)","Stop loss","Target 1","Target 2"],s.map(function(x,i){var L=x.ltp>=x.P;
  return tr([[i+1],[x.sym],['<span class="pill '+(L?"up":"dn")+'">'+(L?"Long":"Short")+"</span>"],[f(x.ltp),"n"],[f(L?x.S1:x.R1),"n"],[f(L?x.R1:x.S1),"n"],[f(L?x.R2:x.S2),"n"]])}),3);
 h+="<h2>Pivot points</h2>"+table(["#","Symbol","S2","S1","Pivot","R1","R2"],s.map(function(x,i){return tr([[i+1],[x.sym],[f(x.S2),"n"],[f(x.S1),"n"],[f(x.P),"n"],[f(x.R1),"n"],[f(x.R2),"n"]])}),2);
 var r=s.slice().sort(function(a,b){return b.chg-a.chg});
 h+="<h2>Stock strength ranking</h2>"+table(["Rank","Symbol","LTP","Change"],r.map(function(x,i){return tr([[i+1],[x.sym],[f(x.ltp),"n"],['<span class="pill '+cls(x.chg)+'">'+pc(x.chg)+"</span>","n"]])}),2);
 return h}

function route(){
 var k=location.hash.slice(1)||"overview";if(k!=="overview"&&!SEC[k])k="overview";
 document.getElementById("main").innerHTML=(k==="overview"?overview():sector(k))+'<p class="note">Sample data for demonstration, not live prices. Pivots: P=(H+L+C)/3, R1=2P−L, S1=2P−H, R2=P+(H−L), S2=P−(H−L). Long if LTP is above the pivot, otherwise short; stop loss and targets are the nearest pivot levels. Educational only, not investment advice.</p>';
 document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",a.dataset.k===k)});
 window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
